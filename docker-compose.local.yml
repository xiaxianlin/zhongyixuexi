services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zhongyixuexi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zhongyixuexi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zhongyixuexi']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: /Users/xiaxianlin/workspace/zhongyixuexi
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://zhongyixuexi:${POSTGRES_PASSWORD}@postgres:5432/zhongyixuexi
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
    ports:
      - '4000:4000'

  web:
    build:
      context: /Users/xiaxianlin/workspace/zhongyixuexi
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '8082:80'

volumes:
  postgres-data:
